name: Release

# Ein Tag wie v1.4.0 baut PowerExec.exe und veröffentlicht sie als GitHub Release.
# Power-Exec prüft diese Releases beim Start und bietet das Update mit Bestätigung an.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version aus dem Tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Tests
        run: dotnet test tests/PowerExec.Core.Tests -c Release

      - name: Veröffentlichen (Einzeldatei, ohne .NET-Installation lauffähig)
        run: >
          dotnet publish src/PowerExec/PowerExec.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o out

      - name: Prüfsumme
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/PowerExec.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PowerExec.exe" | Set-Content -Path out/PowerExec.exe.sha256 -NoNewline -Encoding ascii

      - name: Release erstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS="--generate-notes"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then FLAGS="$FLAGS --prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" out/PowerExec.exe out/PowerExec.exe.sha256 \
            --title "Power-Exec ${{ steps.version.outputs.version }}" $FLAGS
