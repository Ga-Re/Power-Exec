name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  format:
    # Formatierung nach .editorconfig (Einrückung, Leerzeichen). Unter Linux: dort sind die Zeilenenden wie im Repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Formatierung prüfen
        run: dotnet format whitespace PowerExec.sln --verify-no-changes

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tests
        run: dotnet test tests/PowerExec.Core.Tests -c Release

      - name: Tests (Oberflächenlogik)
        run: dotnet test tests/PowerExec.UI.Core.Tests -c Release

      - name: Veröffentlichen (portabel)
        run: >
          dotnet publish src/PowerExec/PowerExec.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:Version=0.0.0-ci -p:SelfTest=true -o out

      - name: Oberflächen-Selbsttest (Panels, Einstellungen, Dialoge)
        shell: pwsh
        timeout-minutes: 7
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $p = Start-Process -FilePath out\PowerExec.exe -ArgumentList '--selftest', $result -PassThru
          $null = $p.Handle  # Exitcode zuverlässig abrufbar machen
          if (-not $p.WaitForExit(300000)) {
            $p.Kill()
            if (Test-Path "$result.progress") { Get-Content "$result.progress" | Select-Object -Last 15 }
            throw 'Selbsttest hat nicht rechtzeitig beendet.'
          }
          if (Test-Path "$result.progress") { Get-Content "$result.progress" | Select-Object -Last 3 }
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Code $($p.ExitCode))." }

      - name: Leistungsmessung des Selbsttests
        if: always()
        shell: pwsh
        run: |
          $perf = Join-Path $env:RUNNER_TEMP 'selftest-perf.md'
          if (Test-Path $perf) {
            Get-Content $perf
            Get-Content $perf | Add-Content $env:GITHUB_STEP_SUMMARY
          } else { Write-Host 'Keine Leistungsmessung vorhanden.' }
          $exe = Get-Item out\PowerExec.exe -ErrorAction SilentlyContinue
          if ($exe) {
            $line = "PowerExec.exe (portabel): $($exe.Length.ToString('N0')) Bytes"
            Write-Host "::notice title=EXE-Größe::$line"
            "`n$line`n" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          $bg = Join-Path $env:RUNNER_TEMP 'selftest-backdrop.md'
          if (Test-Path $bg) {
            Get-Content $bg
            Get-Content $bg | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content $bg | Where-Object { $_ -like '|*' -or $_ -like 'Windows*' } | ForEach-Object { Write-Host "::notice title=Hintergrund::$_" }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-perf
          path: |
            ${{ runner.temp }}/selftest-perf.md
            ${{ runner.temp }}/selftest-perf.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Bildschirmfotos des Selbsttests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-screens
          path: ${{ runner.temp }}/screens/*.png
          retention-days: 5
          if-no-files-found: ignore

      # Bildschirmfotos zusätzlich verkleinert ins Protokoll (JPEG, Base64) – für Umgebungen, die Artefakte nicht laden
      # können (z. B. KI-Sitzungen mit eingeschränktem Netz). Nur wenn die Commit-Nachricht [screens] enthält.
      - name: Bildschirmfotos ins Protokoll
        if: always() && contains(github.event.head_commit.message, '[screens]')
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $dir = Join-Path $env:RUNNER_TEMP 'screens'
          if (-not (Test-Path $dir)) { Write-Host 'Keine Bildschirmfotos vorhanden.'; exit 0 }
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
          $quality = New-Object System.Drawing.Imaging.EncoderParameters 1
          $quality.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality, [long]72)
          foreach ($file in Get-ChildItem $dir -Filter *.png | Sort-Object Name) {
            $img = [System.Drawing.Image]::FromFile($file.FullName)
            $scale = [Math]::Min(1.0, 1200 / [Math]::Max($img.Width, $img.Height))
            $w = [Math]::Max(1, [int]($img.Width * $scale)); $h = [Math]::Max(1, [int]($img.Height * $scale))
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = 'HighQualityBicubic'
            $g.Clear([System.Drawing.Color]::FromArgb(96, 96, 104))   # durchsichtige Flächen neutral hinterlegen
            $g.DrawImage($img, 0, 0, $w, $h)
            $ms = New-Object System.IO.MemoryStream
            $bmp.Save($ms, $codec, $quality)
            $g.Dispose(); $bmp.Dispose(); $img.Dispose()
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            Write-Host "::group::$($file.BaseName)"
            Write-Host "SHOT-BEGIN $($file.BaseName) $w $h"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Host ('SHOT-DATA ' + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
            Write-Host "SHOT-END $($file.BaseName)"
            Write-Host '::endgroup::'
          }

      - name: Veröffentlichen (Programmordner für den Installer)
        run: >
          dotnet publish src/PowerExec/PowerExec.csproj -c Release -r win-x64
          --self-contained true -p:PublishReadyToRun=true -p:Version=0.0.0-ci -o out/app

      - name: Installer bauen (Prüfung)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DMyAppVersion=0.0.0-ci" "/DMyFileVersion=0.0.0" "/DSourceDir=..\out\app" installer\PowerExec.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ist mit Code $LASTEXITCODE fehlgeschlagen." }

      - uses: actions/upload-artifact@v4
        with:
          name: PowerExec-ci
          path: |
            out/PowerExec.exe
            out/PowerExec-Setup.exe
          retention-days: 7
