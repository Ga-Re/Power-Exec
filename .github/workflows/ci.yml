name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests
        run: dotnet test tests/PowerExec.Core.Tests -c Release

      - name: Veröffentlichen (portabel)
        run: >
          dotnet publish src/PowerExec/PowerExec.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:Version=0.0.0-ci -o out

      - name: Veröffentlichen (Programmordner für den Installer)
        run: >
          dotnet publish src/PowerExec/PowerExec.csproj -c Release -r win-x64
          --self-contained true -p:PublishReadyToRun=true -p:Version=0.0.0-ci -o out/app

      - name: Installer bauen (Prüfung)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DMyAppVersion=0.0.0-ci" "/DMyFileVersion=0.0.0" "/DSourceDir=..\out\app" installer\PowerExec.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ist mit Code $LASTEXITCODE fehlgeschlagen." }

      - uses: actions/upload-artifact@v4
        with:
          name: PowerExec-ci
          path: |
            out/PowerExec.exe
            out/PowerExec-Setup.exe
          retention-days: 7
